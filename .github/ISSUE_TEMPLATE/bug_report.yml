name: Bug report
description: Report reproducible behavior that looks incorrect.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, private run artifacts, unpublished research notes, or vulnerability details in a public issue. Use the private process in SECURITY.md for security reports.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the smallest steps needed to reproduce the issue.
      placeholder: |
        1. Run ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or version
      placeholder: "git rev-parse --short HEAD"
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python version, Node.js version, pnpm version, and whether you used uv or conda.
      placeholder: |
        OS:
        Python:
        Node.js:
        pnpm:
        Environment manager:
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste only non-sensitive logs.
      render: text
